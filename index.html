<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutasi Filter Pro - Ahmad Zulfikar T</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #1a2a6c;
            --secondary: #b21f1f;
            --accent: #fdbb2d;
            --bg: #f0f2f5;
            --white: #ffffff;
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; 
            padding: 30px; 
            background-color: var(--bg); 
            color: #333;
        }

        .container { 
            max-width: 1600px; 
            margin: auto; 
            background: var(--white); 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }

        h2 { 
            font-size: 28px; 
            margin-top: 0; 
            color: var(--primary); 
            border-left: 6px solid var(--primary); 
            padding-left: 15px;
            margin-bottom: 25px;
        }

        /* Panel Konfigurasi Lebih Tegas */
        .config-panel { 
            background: #f8fafc; 
            padding: 25px; 
            border-radius: 12px; 
            margin-bottom: 30px; 
            border: 1px solid #e2e8f0; 
        }

        .row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 15px; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 200px; }
        .input-group label { font-weight: 700; color: #475569; font-size: 14px; }
        
        select, input { 
            padding: 12px; 
            border: 2px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 15px; 
            transition: all 0.2s;
            font-weight: 500;
        }
        
        select:focus, input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(26, 42, 108, 0.1); }

        /* Rekening Terdeteksi - BIG & BOLD */
        .info-auto { margin-top: 15px; }
        .acc-badge { 
            background: var(--primary); 
            color: white; 
            padding: 15px 25px; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: 800; 
            display: inline-flex; 
            align-items: center; 
            gap: 12px; 
            box-shadow: 0 4px 12px rgba(26, 42, 108, 0.2);
            border-bottom: 4px solid var(--accent);
        }
        .acc-badge.warning { background: #d97706; border-bottom-color: #ef4444; }

        .btn-group { display: flex; gap: 12px; }
        .btn { 
            padding: 12px 20px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 700; 
            transition: 0.2s; 
            font-size: 14px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .btn-full { background: var(--primary); color: white; }
        .btn-data { background: #059669; color: white; }
        .btn-reset { background: #64748b; color: white; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* Summary Cards - BIG NUMBERS */
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card { 
            padding: 25px; 
            border-radius: 14px; 
            color: white; 
            position: relative;
            overflow: hidden;
        }
        .debit-card { background: linear-gradient(135deg, #e11d48, #9f1239); }
        .credit-card { background: linear-gradient(135deg, #10b981, #065f46); }
        .card small { font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; font-size: 13px; }
        .card .val { font-size: 32px; font-weight: 800; margin-top: 10px; font-family: 'Monaco', 'Consolas', monospace; }

        /* Table Styling */
        .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { 
            background: #f1f5f9; 
            color: #1e293b; 
            padding: 18px 15px; 
            text-align: left; 
            font-size: 14px; 
            font-weight: 800; 
            border-bottom: 3px solid #cbd5e1;
            position: sticky; top: 0;
        }
        td { padding: 16px 15px; border-bottom: 1px solid #f1f5f9; font-size: 13px; font-weight: 500; }
        tr:hover { background-color: #f8fafc; }
        
        .num-col { text-align: right; font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 15px; }
        .txt-red { color: #be123c; }
        .txt-green { color: #047857; }
        
        .trx-id-tag { 
            background: #dcfce7; 
            color: #166534; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-family: 'Consolas', monospace; 
            font-weight: 700;
            font-size: 12px;
            border: 1px solid #bbf7d0;
        }
        .empty-dash { color: #cbd5e1; font-weight: 300; }

        footer { text-align: center; padding: 40px; color: #94a3b8; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 Mutasi Bank Manager Pro</h2>

    <div class="config-panel">
        <div class="row">
            <div class="input-group" style="flex: 1.5;">
                <label>1. SUMBER BANK / AKUN</label>
                <select id="bankSource">
                    <option value="">-- Pilih Bank Secara Manual --</option>
                    <option value="BCA">BCA (Corporate)</option>
                    <option value="BNI">BNI (Direct)</option>
                    <option value="MANDIRI">Mandiri (Statement)</option>
                    <option value="BRI">BRI (Corporate/CMS)</option>
                    <option value="BSI">BSI</option>
                    <option value="BTN">BTN</option>
                    <option value="MAYBANK">Maybank</option>
                    <option value="JATIM">Bank Jatim</option>
                </select>
                <div id="autoInfo" class="info-auto"></div>
            </div>
            <div class="input-group">
                <label>2. UPLOAD FILE CSV</label>
                <input type="file" id="csvFile" accept=".csv">
            </div>
            <div class="btn-group">
                <button class="btn btn-full" onclick="copyFullTable()">📋 COPY SEMUA</button>
                <button class="btn btn-data" onclick="copyIsiSaja()">📄 COPY ISI</button>
                <button class="btn btn-reset" onclick="resetPage()">🔄 RESET</button>
            </div>
        </div>
        <div class="row" style="margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 20px;">
            <div class="input-group"><label>DARI TANGGAL</label><input type="date" id="startDate"></div>
            <div class="input-group"><label>SAMPAI TANGGAL</label><input type="date" id="endDate"></div>
            <div class="input-group">
                <label>TIPE TRANSAKSI</label>
                <select id="typeFilter">
                    <option value="ALL">SEMUA</option>
                    <option value="DEBIT">DEBIT (KELUAR)</option>
                    <option value="CREDIT">CREDIT (MASUK)</option>
                </select>
            </div>
            <div class="input-group" style="flex: 2;"><label>CARI KETERANGAN</label><input type="text" id="searchTerm" placeholder="Ketik nama vendor, keterangan, atau nominal..."></div>
        </div>
    </div>

    <div class="summary-grid">
        <div class="card debit-card">
            <small>Total Pengeluaran (Debit)</small>
            <div id="dispDebit" class="val">0,00</div>
        </div>
        <div class="card credit-card">
            <small>Total Pemasukan (Credit)</small>
            <div id="dispCredit" class="val">0,00</div>
        </div>
    </div>

    <div class="table-container">
        <table id="mutasiTable">
            <thead>
                <tr>
                    <th width="120">TANGGAL</th>
                    <th>KETERANGAN TRANSAKSI</th>
                    <th width="180" style="text-align:right">DEBIT (-)</th>
                    <th width="180" style="text-align:right">CREDIT (+)</th>
                    <th width="200">TRANSACTION ID</th>
                </tr>
            </thead>
            <tbody id="tableData">
                <tr><td colspan="5" style="text-align:center; padding:60px; color:#94a3b8; font-size: 16px;">Belum ada data. Silakan upload file CSV mutasi Anda.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<footer> 🚀 Dashboard Mutasi | Ahmad Zulfikar T | 2026 </footer>

<script>
    let db = [];
    let currentDetectedBank = "";

    const ACCOUNT_MAP = {
        "1020190001": { bank: "BNI", label: "PT SID - BNI 001" },
        "1040170002": { bank: "BNI", label: "PT SID - BNI 002" },
        "5995333390": { bank: "BCA", label: "PT SID - BCA" },
        "1270011209408": { bank: "MANDIRI", label: "PT SID - MANDIRI" },
        "0641003913": { bank: "JATIM", label: "PT SID - JATIM" },
        "7298344674": { bank: "BSI", label: "PT SID - BSI" },
        "0061801300000149": { bank: "BTN", label: "PT SID - BTN KEMANG" },
        "1260013546501": { bank: "MANDIRI", label: "YYS GURU BELAJAR - MANDIRI" },
        "113001000683303": { bank: "BRI", label: "BRI YKID" }
    };

    function detectBankAndAccount(fileName, rawData) {
        let fullText = JSON.stringify(rawData) + fileName;
        let detected = null;
        for (let accNo in ACCOUNT_MAP) {
            if (fullText.includes(accNo)) {
                detected = { acc: accNo, ...ACCOUNT_MAP[accNo] };
                break;
            }
        }
        const autoInfo = document.getElementById('autoInfo');
        const bankSelect = document.getElementById('bankSource');
        if (detected) {
            bankSelect.value = detected.bank;
            currentDetectedBank = detected.bank;
            autoInfo.innerHTML = `<div class="acc-badge">🏦 ${detected.label} | ${detected.acc}</div>`;
            return detected.bank;
        } else {
            currentDetectedBank = bankSelect.value;
            autoInfo.innerHTML = `<div class="acc-badge warning">⚠️ AKUN TIDAK TERDAFTAR</div>`;
            return bankSelect.value;
        }
    }

    function parseDynamicDate(dateStr) {
        if (!dateStr) return null;
        let clean = dateStr.toString().trim().replace(/"/g, '').toUpperCase();
        if (clean.includes('/')) {
            let p = clean.split(' ')[0].split('/');
            let d = p[0].padStart(2, '0'), m = p[1].padStart(2, '0'), y = p[2]?.length === 2 ? "20" + p[2] : p[2];
            return { iso: `${y}-${m}-${d}`, display: `${d}/${m}/${y}` };
        }
        if (clean.includes('-')) {
            let p = clean.split(' ')[0].split('-');
            if (p[0].length === 4) return { iso: p.join('-'), display: `${p[2]}/${p[1]}/${p[0]}` };
            return { iso: `${p[2]}-${p[1]}-${p[0]}`, display: `${p[0]}/${p[1]}/${p[2]}` };
        }
        return null;
    }

    function cleanAmt(val) {
        if (!val || val === "0") return 0;
        let s = val.toString().replace(/CR|DB/gi, '').replace(/,/g, '').replace(/"/g, '').trim();
        return parseFloat(s) || 0;
    }

    document.getElementById('csvFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        Papa.parse(file, {
            header: false, skipEmptyLines: true, complete: (results) => {
                db = [];
                let raw = results.data;
                const bank = detectBankAndAccount(file.name, raw);
                
                if (bank === 'BCA') {
                    let headerIdx = raw.findIndex(r => r.some(c => c && c.toLowerCase().includes("tanggal transaksi")));
                    let headers = raw[headerIdx].map(h => h.toLowerCase().trim());
                    let tglCol = headers.findIndex(h => h.includes("tanggal")), ketCol = headers.findIndex(h => h.includes("keterangan")), jmlCol = headers.findIndex(h => h.includes("jumlah"));
                    for (let i = headerIdx + 1; i < raw.length; i++) {
                        let r = raw[i]; if (!r[tglCol] || r[tglCol].toLowerCase().includes("saldo")) continue;
                        let dateInfo = parseDynamicDate(r[tglCol]); if (!dateInfo) continue;
                        let isCr = (r[jmlCol] || "").toUpperCase().includes("CR"), amt = cleanAmt(r[jmlCol]);
                        // Ambil ID Transaksi dari Keterangan BCA (biasanya angka unik di awal atau tengah)
                        let match = r[ketCol].match(/[0-9]{6,}/);
                        db.push({ iso: dateInfo.iso, displayDate: dateInfo.display, trxId: match ? match[0] : "-", desc: r[ketCol], deb: isCr ? 0 : amt, cre: isCr ? amt : 0 });
                    }
                } else {
                    // Logic umum untuk bank lain (Jatim, Mandiri, BSI dkk)
                    let headerIdx = raw.findIndex(r => r.some(c => ["date", "tanggal", "posting date", "tgl_tran"].includes((c || "").toLowerCase().trim())));
                    if (headerIdx === -1) headerIdx = 0;
                    let headers = raw[headerIdx].map(h => (h || "").trim());
                    for (let i = headerIdx + 1; i < raw.length; i++) {
                        let r = raw[i]; if (!r || r.length < 3) continue;
                        let rowObj = {}; headers.forEach((h, idx) => rowObj[h] = r[idx]);
                        let dateKey = Object.keys(rowObj).find(k => /date|tanggal|tgl/i.test(k));
                        let dateInfo = parseDynamicDate(rowObj[dateKey]); if (!dateInfo) continue;
                        let deb = cleanAmt(rowObj['Debit'] || rowObj['Debit Amount'] || rowObj['MUTASI_DEBET'] || (rowObj['DB'] ? rowObj['Amount'] : 0));
                        let cre = cleanAmt(rowObj['Credit'] || rowObj['Credit Amount'] || rowObj['MUTASI_KREDIT'] || (rowObj['CR'] ? rowObj['Amount'] : 0));
                        db.push({ iso: dateInfo.iso, displayDate: dateInfo.display, trxId: "-", desc: rowObj['Description'] || rowObj['Remarks'] || rowObj['DESK_TRAN'] || "", deb, cre });
                    }
                }
                render();
            }
        });
    });

    function render() {
        const term = document.getElementById('searchTerm').value.toLowerCase();
        const start = document.getElementById('startDate').value, end = document.getElementById('endDate').value, typeF = document.getElementById('typeFilter').value;
        let sD = 0, sC = 0, html = '';

        db.filter(i => {
            const mS = (i.desc || "").toLowerCase().includes(term);
            const mD = (!start || i.iso >= start) && (!end || i.iso <= end);
            const mT = (typeF === "ALL") || (typeF === "DEBIT" && i.deb > 0) || (typeF === "CREDIT" && i.cre > 0);
            return mS && mD && mT;
        }).sort((a,b) => new Date(a.iso) - new Date(b.iso)).forEach(i => {
            sD += i.deb; sC += i.cre;
            // HANYA BCA yang muncul Trx ID
            let trxHtml = (currentDetectedBank === "BCA" && i.trxId !== "-") ? `<span class="trx-id-tag">${i.trxId}</span>` : `<span class="empty-dash">-</span>`;

            html += `<tr>
                <td style="font-weight:700">${i.displayDate}</td>
                <td>${i.desc}</td>
                <td class="num-col txt-red">${i.deb > 0 ? i.deb.toLocaleString('en-US',{minimumFractionDigits:2}) : '0,00'}</td>
                <td class="num-col txt-green">${i.cre > 0 ? i.cre.toLocaleString('en-US',{minimumFractionDigits:2}) : '0,00'}</td>
                <td>${trxHtml}</td>
            </tr>`;
        });
        document.getElementById('tableData').innerHTML = html || '<tr><td colspan="5" style="text-align:center; padding:40px;">Data Tidak Ditemukan.</td></tr>';
        document.getElementById('dispDebit').innerText = sD.toLocaleString('en-US', {minimumFractionDigits:2});
        document.getElementById('dispCredit').innerText = sC.toLocaleString('en-US', {minimumFractionDigits:2});
    }

    function copyFullTable() {
        const rows = document.querySelectorAll("#mutasiTable tr");
        let content = "";
        rows.forEach(row => {
            let rowData = []; row.querySelectorAll("td, th").forEach(col => rowData.push(col.innerText));
            content += rowData.join("\t") + "\n";
        });
        saveToClipboard(content);
    }

    function copyIsiSaja() {
        const rows = document.querySelectorAll("#tableData tr");
        let content = "";
        rows.forEach(row => {
            let cells = row.querySelectorAll("td");
            if (cells.length >= 4) {
                let rowData = [cells[0].innerText, cells[1].innerText, cells[2].innerText, cells[3].innerText];
                content += rowData.join("\t") + "\n";
            }
        });
        saveToClipboard(content);
    }

    function saveToClipboard(text) { navigator.clipboard.writeText(text).then(() => alert("Berhasil disalin ke Clipboard!")); }
    function resetPage() { location.reload(); }
    ['searchTerm', 'startDate', 'endDate', 'typeFilter', 'bankSource'].forEach(id => document.getElementById(id).addEventListener('input', render));
</script>
</body>
</html>

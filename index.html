<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutasi Filter Pro - Ahmad Zulfikar T</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background-color: #f4f7f9; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 1450px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); flex: 1; }
        .config-panel { background: #eef2f7; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #d1d9e6; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
        select, input { padding: 10px; border: 1px solid #bec8d0; border-radius: 6px; font-size: 14px; }
        .btn-group { display: flex; gap: 10px; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 12px; display: flex; align-items: center; gap: 5px; }
        .btn-full { background: #3498db; color: white; }
        .btn-data { background: #2ecc71; color: white; }
        .btn-reset { background: #95a5a6; color: white; }
        .info-rekening { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; border-left: 5px solid #f1c40f; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { padding: 15px; border-radius: 8px; color: white; }
        .debit-card { background: #e74c3c; }
        .credit-card { background: #27ae60; }
        .val { font-size: 1.5rem; font-weight: bold; font-family: 'Consolas', monospace; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; }
        th { background: #2c3e50; color: white; padding: 12px; text-align: left; font-size: 13px; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 12px; }
        .num-col { text-align: right; font-family: 'Courier New', monospace; font-weight: bold; }
        .txt-red { color: #e74c3c; }
        .txt-green { color: #27ae60; }
        .trx-id { font-family: 'Consolas', monospace; color: #2980b9; font-weight: bold; }
        .kat-badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; white-space: nowrap; }
        .bg-sesama { background: #27ae60; }
        .bg-non { background: #f39c12; }
        .bg-biaya { background: #8e44ad; }
        .bg-manual { background: #34495e; } 
        .bg-biaya-manual { background: #16a085; }
        footer { text-align: center; padding: 20px; margin-top: 20px; color: #7f8c8d; font-size: 14px; border-top: 1px solid #eee; }
        .heart { color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 Convert Mutasi All Bank</h2>

    <div class="config-panel">
        <div class="row">
            <div class="input-group">
                <label><strong>1. Pilih Bank:</strong></label>
                <select id="bankSource">
                    <option value="">-- Pilih Bank --</option>
                    <option value="BCA">BCA (Corporate)</option>
                    <option value="BNI">BNI (Direct)</option>
                    <option value="MANDIRI">Mandiri (Statement)</option>
                    <option value="BRI">BRI (Corporate/CMS)</option>
                    <option value="BSI">BSI</option>
                    <option value="MAYBANK">Maybank</option>
                </select>
            </div>
            <div class="input-group">
                <label><strong>2. Upload CSV:</strong></label>
                <input type="file" id="csvFile" accept=".csv">
            </div>
            <div class="btn-group">
                <button class="btn btn-full" onclick="copyFullTable()">📋 Salin Full Tabel</button>
                <button class="btn btn-data" onclick="copyIsiSaja()">📄 Salin Isi Saja</button>
                <button class="btn btn-reset" onclick="resetPage()">🔄 Reset</button>
            </div>
        </div>
        <div class="row">
            <div class="input-group"><label>Dari Tanggal:</label><input type="date" id="startDate"></div>
            <div class="input-group"><label>Sampai Tanggal:</label><input type="date" id="endDate"></div>
            <div class="input-group"><label>Cari Keterangan / Trx ID:</label><input type="text" id="searchTerm" placeholder="Cari teks..."></div>
        </div>
    </div>

    <div id="infoRekPanel" class="info-rekening">
        <h3 id="dispBankName" style="margin:0">BANK</h3>
        <p id="dispAccNo" style="margin:5px 0 0 0">No. Rekening: -</p>
    </div>

    <div class="summary-grid">
        <div class="card debit-card"><small>TOTAL DEBIT (KELUAR)</small><div id="dispDebit" class="val">0.00</div></div>
        <div class="card credit-card"><small>TOTAL CREDIT (MASUK)</small><div id="dispCredit" class="val">0.00</div></div>
    </div>

    <table id="mutasiTable">
        <thead>
            <tr>
                <th>Tanggal</th>
                <th>Keterangan</th>
                <th>Debit</th>
                <th>Credit</th>
                <th>Transaction ID</th>
                <th>Kategori Transfer</th>
            </tr>
        </thead>
        <tbody id="tableData">
            <tr><td colspan="6" style="text-align:center; padding:40px; color:#999;">Pilih bank & upload file CSV.</td></tr>
        </tbody>
    </table>
</div>

<footer> Made With <span class="heart">❤️</span> Ahmad Zulfikar T </footer>

<script>
    let db = [];
    const todayISO = new Date().toISOString().split('T')[0];

    function extractBCAInfo(text, amt, type) {
        if (!text) return { id: "-", kat: "-" };
        let upperText = text.toUpperCase();
        let kategori = "-";
        let cleanId = "-";

        if (type === 'DB' && (upperText.includes("BI-FAST") || upperText.includes("TRANSFER KE") || upperText.includes("BIAYA TXN KE"))) {
            if (upperText.includes("BIAYA TXN") || amt === 2500) return { id: "-", kat: "Biaya Transfer Manual" };
            if (upperText.includes("TRANSFER KE") || amt > 2500) return { id: "-", kat: "Manual" };
        }

        const isFee = upperText.includes("BA JASA E-BANKING") || upperText.includes("BIAYA AUTOTRANSFER") || upperText.includes("ATCHG");
        const regex = /(N?BCA)-[A-Z0-9-]{5,}/i;
        const match = text.match(regex);
        
        if (match) {
            cleanId = match[0].toUpperCase();
            if (isFee) kategori = "Biaya Transfer Non BCA";
            else if (cleanId.startsWith('NBCA')) kategori = "Non BCA";
            else kategori = "Sesama BCA";
        } else if (isFee) {
            kategori = "Biaya Transfer Non BCA";
        }
        
        return { id: cleanId, kat: kategori };
    }

    function parseDynamicDate(dateStr) {
        if (!dateStr) return null;
        let clean = dateStr.toString().trim().replace(/"/g, '');

        // Handle BNI (04/02/26 09.00.19)
        if (clean.includes('/') && clean.includes('.')) {
             let p = clean.split(' ')[0].split('/');
             let d = p[0].padStart(2, '0');
             let m = p[1].padStart(2, '0');
             let y = p[2].length === 2 ? "20" + p[2] : p[2];
             return { iso: `${y}-${m}-${d}`, display: `${d}/${m}/${y}` };
        }

        // Handle Mandiri: 11 March 2026
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        for(let mIdx=0; mIdx < months.length; mIdx++) {
            if(clean.includes(months[mIdx])) {
                let parts = clean.split(' ');
                let d = parts[0].padStart(2, '0');
                let m = (mIdx + 1).toString().padStart(2, '0');
                let y = parts[2];
                return { iso: `${y}-${m}-${d}`, display: `${d}/${m}/${y}` };
            }
        }

        // Handle ISO/BRI: 2026-03-03
        if (clean.includes('-')) {
            let p = clean.split(' ')[0].split('-');
            if (p[0].length === 4) return { iso: p.join('-'), display: `${p[2]}/${p[1]}/${p[0]}` };
            return { iso: `${p[2]}-${p[1]}-${p[0]}`, display: `${p[0]}/${p[1]}/${p[2]}` };
        }
        
        // General Slash: 01/03/2026
        if (clean.includes('/')) {
            let p = clean.split(' ')[0].split('/');
            let d = p[0].padStart(2, '0');
            let m = p[1].padStart(2, '0');
            let y = p[2] ? (p[2].length === 2 ? "20" + p[2] : p[2]) : new Date().getFullYear();
            return { iso: `${y}-${m}-${d}`, display: `${d}/${m}/${y}` };
        }
        return null;
    }

    function cleanAmt(val) {
        if (!val) return 0;
        let s = val.toString().replace(/CR|DB/gi, '').replace(/,/g, '').replace(/"/g, '').trim();
        if (s === '.') return 0; // Khusus BNI yang tulis .00
        return parseFloat(s) || 0;
    }

    function resetPage() { location.reload(); }

    document.getElementById('csvFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const bank = document.getElementById('bankSource').value;
        if (!bank || !file) return;

        const fileNameMatch = file.name.match(/\d{10,}/);
        if (fileNameMatch) {
            document.getElementById('dispBankName').innerText = "BANK " + bank;
            document.getElementById('dispAccNo').innerText = "No. Rekening (Auto): " + fileNameMatch[0];
            document.getElementById('infoRekPanel').style.display = 'block';
        }

        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            delimiter: "",
            complete: (results) => {
                db = [];
                let data = results.data;
                
                if (bank === 'BCA') {
                    Papa.parse(file, {
                        header: false,
                        complete: (bcaRes) => {
                            let bcaData = bcaRes.data;
                            let accRow = bcaData.find(r => r[0] && r[0].toLowerCase().includes("no. rekening"));
                            if (accRow) {
                                document.getElementById('dispBankName').innerText = "BANK BCA";
                                document.getElementById('dispAccNo').innerText = "No. Rekening: " + accRow[0].split(":")[1].trim();
                                document.getElementById('infoRekPanel').style.display = 'block';
                            }
                            let headerIdx = bcaData.findIndex(r => r.some(c => c && c.toLowerCase().includes("tanggal transaksi")));
                            let headers = bcaData[headerIdx].map(h => h.toLowerCase().trim());
                            let tglCol = headers.findIndex(h => h.includes("tanggal"));
                            let ketCol = headers.findIndex(h => h.includes("keterangan"));
                            let jmlCol = headers.findIndex(h => h.includes("jumlah"));

                            for (let i = headerIdx + 1; i < bcaData.length; i++) {
                                let r = bcaData[i];
                                if (!r[tglCol] || r[tglCol].toLowerCase().includes("saldo")) continue;
                                let dateInfo = parseDynamicDate(r[tglCol]);
                                if (!dateInfo) continue;
                                let amtStr = (r[jmlCol] || "").toUpperCase();
                                let isCr = amtStr.includes("CR");
                                let trx = extractBCAInfo(r[ketCol], cleanAmt(amtStr), isCr ? "CR" : "DB");
                                db.push({ iso: dateInfo.iso, displayDate: dateInfo.display, trxId: trx.id, kategori: trx.kat, desc: r[ketCol], deb: isCr ? 0 : cleanAmt(amtStr), cre: isCr ? cleanAmt(amtStr) : 0 });
                            }
                            render();
                        }
                    });
                } else {
                    data.forEach(row => {
                        let dateStr = row['Post Date'] || row['PostDate'] || row['Posting Date'] || row['TGL_TRAN'] || row['Date'] || row['Tanggal'];
                        let dateInfo = parseDynamicDate(dateStr);
                        if (!dateInfo) return;

                        let desc = row['Description'] || row['Remarks'] || row['DESK_TRAN'] || row['Keterangan'] || "";
                        let deb = cleanAmt(row['Debit'] || row['Debit Amount'] || row['MUTASI_DEBET']);
                        let cre = cleanAmt(row['Credit'] || row['Credit Amount'] || row['MUTASI_KREDIT']);
                        
                        // Handle BRI GLSIGN
                        if(row['GLSIGN'] === 'Db' && deb === 0) deb = cleanAmt(row['SALDO_AKHIR_MUTASI']);
                        if(row['GLSIGN'] === 'Cr' && cre === 0) cre = cleanAmt(row['SALDO_AKHIR_MUTASI']);

                        db.push({ iso: dateInfo.iso, displayDate: dateInfo.display, trxId: "-", kategori: "-", desc, deb, cre });
                    });
                    render();
                }
            }
        });
    });

    function render() {
        const term = document.getElementById('searchTerm').value.toLowerCase();
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        let sD = 0, sC = 0, html = '';

        db.filter(i => {
            const mS = (i.desc || "").toLowerCase().includes(term) || (i.trxId || "").toLowerCase().includes(term);
            const mD = (!start || i.iso >= start) && (!end || i.iso <= end);
            return mS && mD;
        }).sort((a,b) => new Date(a.iso) - new Date(b.iso))
        .forEach(i => {
            sD += i.deb; sC += i.cre;
            let katClass = "";
            if (i.kategori === "Sesama BCA") katClass = "bg-sesama";
            else if (i.kategori === "Non BCA") katClass = "bg-non";
            else if (i.kategori === "Biaya Transfer Non BCA") katClass = "bg-biaya";
            else if (i.kategori === "Manual") katClass = "bg-manual";
            else if (i.kategori === "Biaya Transfer Manual") katClass = "bg-biaya-manual";

            html += `<tr><td>${i.displayDate}</td><td style="font-size:11px">${i.desc}</td><td class="num-col txt-red">${i.deb > 0 ? i.deb.toLocaleString('en-US', {minimumFractionDigits:2}) : '0.00'}</td><td class="num-col txt-green">${i.cre > 0 ? i.cre.toLocaleString('en-US', {minimumFractionDigits:2}) : '0.00'}</td><td class="trx-id">${i.trxId}</td><td><span class="kat-badge ${katClass}">${i.kategori}</span></td></tr>`;
        });

        document.getElementById('tableData').innerHTML = html || '<tr><td colspan="6" style="text-align:center; padding:20px;">Data tidak ditemukan.</td></tr>';
        document.getElementById('dispDebit').innerText = sD.toLocaleString('en-US', {minimumFractionDigits:2});
        document.getElementById('dispCredit').innerText = sC.toLocaleString('en-US', {minimumFractionDigits:2});
    }

    function copyFullTable() {
        const rows = document.querySelectorAll("#mutasiTable tr");
        let content = "";
        rows.forEach(row => {
            let rowData = [];
            row.querySelectorAll("td, th").forEach(col => rowData.push(col.innerText));
            content += rowData.join("\t") + "\n";
        });
        saveToClipboard(content);
    }

    function copyIsiSaja() {
        const rows = document.querySelectorAll("#tableData tr");
        let content = "";
        rows.forEach(row => {
            let cells = row.querySelectorAll("td");
            if (cells.length >= 4) {
                let rowData = [cells[0].innerText, cells[1].innerText, cells[2].innerText, cells[3].innerText];
                content += rowData.join("\t") + "\n";
            }
        });
        saveToClipboard(content);
    }

    function saveToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => alert("Data berhasil disalin!"));
    }

    ['searchTerm', 'startDate', 'endDate'].forEach(id => document.getElementById(id).addEventListener('input', render));
</script>
</body>
</html>

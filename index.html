<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutasi Filter Pro - Ahmad Zulfikar T</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background-color: #f4f7f9; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 1550px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); flex: 1; }
        .config-panel { background: #eef2f7; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #d1d9e6; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
        select, input { padding: 10px; border: 1px solid #bec8d0; border-radius: 6px; font-size: 14px; }
        .info-auto { font-size: 12px; color: #2980b9; font-weight: bold; margin-top: 5px; min-height: 18px; }
        .btn-group { display: flex; gap: 10px; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 12px; display: flex; align-items: center; gap: 5px; }
        .btn-full { background: #3498db; color: white; }
        .btn-data { background: #2ecc71; color: white; }
        .btn-reset { background: #95a5a6; color: white; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { padding: 15px; border-radius: 8px; color: white; }
        .debit-card { background: #e74c3c; }
        .credit-card { background: #27ae60; }
        .val { font-size: 1.5rem; font-weight: bold; font-family: 'Consolas', monospace; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; }
        th { background: #2c3e50; color: white; padding: 12px; text-align: left; font-size: 13px; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 11px; }
        .num-col { text-align: right; font-family: 'Courier New', monospace; font-weight: bold; }
        .txt-red { color: #e74c3c; }
        .txt-green { color: #27ae60; }
        .trx-id { font-family: 'Consolas', monospace; color: #2980b9; font-weight: bold; }
        .kat-badge { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; color: white; white-space: nowrap; }
        footer { text-align: center; padding: 20px; margin-top: 20px; color: #7f8c8d; font-size: 14px; border-top: 1px solid #eee; }
        .heart { color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 Convert Mutasi All Bank</h2>

    <div class="config-panel">
        <div class="row">
            <div class="input-group">
                <label><strong>1. Pilih Bank:</strong></label>
                <select id="bankSource">
                    <option value="">-- Pilih Bank --</option>
                    <option value="BCA">BCA (Corporate)</option>
                    <option value="BNI">BNI (Direct)</option>
                    <option value="MANDIRI">Mandiri (Statement)</option>
                    <option value="BRI">BRI (Corporate/CMS)</option>
                    <option value="BSI">BSI</option>
                    <option value="BTN">BTN</option>
                    <option value="MAYBANK">Maybank</option>
                    <option value="JATIM">Bank Jatim</option>
                </select>
                <div id="autoInfo" class="info-auto"></div>
            </div>
            <div class="input-group">
                <label><strong>2. Upload CSV:</strong></label>
                <input type="file" id="csvFile" accept=".csv">
            </div>
            <div class="btn-group">
                <button class="btn btn-full" onclick="copyFullTable()">📋 Salin Full Tabel</button>
                <button class="btn btn-data" onclick="copyIsiSaja()">📄 Salin Isi Saja</button>
                <button class="btn btn-reset" onclick="resetPage()">🔄 Reset</button>
            </div>
        </div>
        <div class="row">
            <div class="input-group"><label>Dari Tanggal:</label><input type="date" id="startDate"></div>
            <div class="input-group"><label>Sampai Tanggal:</label><input type="date" id="endDate"></div>
            <div class="input-group">
                <label>Tampilkan Tipe:</label>
                <select id="typeFilter">
                    <option value="ALL">Semua Transaksi</option>
                    <option value="DEBIT">Hanya Debit (Keluar)</option>
                    <option value="CREDIT">Hanya Credit (Masuk)</option>
                </select>
            </div>
            <div class="input-group"><label>Cari Keterangan / Kode:</label><input type="text" id="searchTerm" placeholder="Cari teks..."></div>
        </div>
    </div>

    <div class="summary-grid">
        <div class="card debit-card"><small>TOTAL DEBIT (KELUAR)</small><div id="dispDebit" class="val">0.00</div></div>
        <div class="card credit-card"><small>TOTAL CREDIT (MASUK)</small><div id="dispCredit" class="val">0.00</div></div>
    </div>

    <table id="mutasiTable">
        <thead>
            <tr>
                <th>Tanggal</th>
                <th>Keterangan</th>
                <th>Debit</th>
                <th>Credit</th>
                <th>Transaction ID</th>
                <th>Kategori Transfer</th>
                <th style="text-align:center">Status Transfer</th>
            </tr>
        </thead>
        <tbody id="tableData">
            <tr><td colspan="7" style="text-align:center; padding:40px; color:#999;">Upload file CSV untuk memulai.</td></tr>
        </tbody>
    </table>
</div>

<footer> Made With <span class="heart">❤️</span> Ahmad Zulfikar T </footer>

<script>
    let db = [];
    
    const ACCOUNT_MAP = {
        "1020190001": { bank: "BNI", label: "PT SID - BNI 001" },
        "1040170002": { bank: "BNI", label: "PT SID - BNI 002" },
        "1030170004": { bank: "BNI", label: "PT SID - BNI 004" },
        "1020170006": { bank: "BNI", label: "PT SID - BNI 006" },
        "2030170007": { bank: "BNI", label: "PT SID - BNI 007" },
        "5995333390": { bank: "BCA", label: "PT SID - BCA" },
        "034001002848309": { bank: "BRI", label: "PT SID - BRI OTISTA 09" },
        "113001000661301": { bank: "BRI", label: "PT SID - BRI BANGKA 01" },
        "1270011209408": { bank: "MANDIRI", label: "PT SID - MANDIRI" },
        "0641003913": { bank: "JATIM", label: "PT SID - JATIM" },
        "7298344674": { bank: "BSI", label: "PT SID - BSI" },
        "0061801300000149": { bank: "BTN", label: "PT SID - BTN KEMANG" },
        "0001601880007584": { bank: "BTN", label: "PT SID - BTN BEKASI" },
        "1000809288": { bank: "BSN", label: "PT SID - BSN" },
        "6700020201": { bank: "BNI", label: "YYS SID - BNI 01" },
        "945664832": { bank: "BNI", label: "YYS SID - BNI 32" },
        "5995553551": { bank: "BCA", label: "YYS SID - BCA" },
        "113001000750566": { bank: "BRI", label: "YYS SID - BRI" },
        "2863038278": { bank: "BCA", label: "PT MMI - BCA" },
        "1260013546501": { bank: "MANDIRI", label: "YYS GURU BELAJAR - MANDIRI" },
        "5055082526": { bank: "BCA", label: "BCA Epicentrum" },
        "5995232526": { bank: "BCA", label: "BCA Manhattan" },
        "113001000457304": { bank: "BRI", label: "BRI" },
        "7342760880": { bank: "BSI", label: "BSI (Maxima)" },
        "2775000772": { bank: "MAYBANK", label: "Maybank Saving" },
        "2775000817": { bank: "MAYBANK", label: "Maybank Kreditur" },
        "113001000683303": { bank: "BRI", label: "BRI YKID" }
    };

    function detectBankAndAccount(fileName, rawData) {
        let fullText = JSON.stringify(rawData) + fileName;
        let detected = null;

        for (let accNo in ACCOUNT_MAP) {
            if (fullText.includes(accNo)) {
                detected = { acc: accNo, ...ACCOUNT_MAP[accNo] };
                break;
            }
        }
        
        const autoInfo = document.getElementById('autoInfo');
        const bankSelect = document.getElementById('bankSource');

        if (detected) {
            bankSelect.value = detected.bank;
            autoInfo.innerText = `✅ Terdeteksi: ${detected.label} (${detected.acc})`;
            return detected.bank;
        } else {
            autoInfo.innerText = "⚠️ Akun tidak dikenali secara otomatis.";
            return bankSelect.value;
        }
    }

    function parseDynamicDate(dateStr) {
        if (!dateStr) return null;
        let clean = dateStr.toString().trim().replace(/"/g, '').toUpperCase();
        if (clean === "PEND") {
            const now = new Date();
            return { iso: now.toISOString().split('T')[0], display: `${now.getDate().toString().padStart(2,'0')}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getFullYear()}` };
        }
        const months = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
        const monthsShort = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
        for(let i=0; i<12; i++) {
            if(clean.includes(months[i]) || clean.includes(monthsShort[i])) {
                let p = clean.split(/[\s,/-]+/);
                let d = p[0].padStart(2, '0');
                let m = (i + 1).toString().padStart(2, '0');
                let y = p[2] ? (p[2].length === 2 ? "20" + p[2] : p[2]) : new Date().getFullYear();
                return { iso: `${y}-${m}-${d}`, display: `${d}/${m}/${y}` };
            }
        }
        if (clean.includes('-')) {
            let p = clean.split(' ')[0].split('-');
            if (p[0].length === 4) return { iso: p.join('-'), display: `${p[2].padStart(2,'0')}/${p[1].padStart(2,'0')}/${p[0]}` };
            return { iso: `${p[2]}-${p[1]}-${p[0]}`, display: `${p[0].padStart(2,'0')}/${p[1].padStart(2,'0')}/${p[2]}` };
        }
        if (clean.includes('/')) {
            let p = clean.split(' ')[0].split('/');
            let d = p[0].padStart(2, '0');
            let m = p[1].padStart(2, '0');
            let y = p[2] ? (p[2].length === 2 ? "20" + p[2] : p[2]) : new Date().getFullYear();
            return { iso: `${y}-${m}-${d}`, display: `${d}/${m}/${y}` };
        }
        return null;
    }

    function cleanAmt(val) {
        if (!val || val === "0") return 0;
        let s = val.toString().replace(/CR|DB/gi, '').replace(/,/g, '').replace(/"/g, '').trim();
        return parseFloat(s) || 0;
    }

    function resetPage() { location.reload(); }

    document.getElementById('csvFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        Papa.parse(file, {
            header: false, skipEmptyLines: true, complete: (results) => {
                db = [];
                let raw = results.data;
                const bank = detectBankAndAccount(file.name, raw);
                if (!bank) return;

                if (bank === 'BCA') {
                    let headerIdx = raw.findIndex(r => r.some(c => c && c.toLowerCase().includes("tanggal transaksi")));
                    let headers = raw[headerIdx].map(h => h.toLowerCase().trim());
                    let tglCol = headers.findIndex(h => h.includes("tanggal")), ketCol = headers.findIndex(h => h.includes("keterangan")), jmlCol = headers.findIndex(h => h.includes("jumlah"));
                    for (let i = headerIdx + 1; i < raw.length; i++) {
                        let r = raw[i];
                        if (!r[tglCol] || r[tglCol].toLowerCase().includes("saldo")) continue;
                        let dateInfo = parseDynamicDate(r[tglCol]);
                        if (!dateInfo) continue;
                        let isCr = (r[jmlCol] || "").toUpperCase().includes("CR"), amt = cleanAmt(r[jmlCol]);
                        db.push({ iso: dateInfo.iso, displayDate: dateInfo.display, trxId: "-", kategori: "-", desc: r[ketCol], deb: isCr ? 0 : amt, cre: isCr ? amt : 0, status: "" });
                    }
                } else if (bank === 'JATIM') {
                    let headerIdx = raw.findIndex(r => r.some(c => c && c.toLowerCase().includes("posting date")));
                    let headers = raw[headerIdx].map(h => h.toLowerCase().trim());
                    let tglCol = headers.indexOf("posting date"), ketCol = headers.indexOf("description"), debCol = headers.indexOf("debit"), creCol = headers.indexOf("credit"), refCol = headers.indexOf("reference no");
                    for (let i = headerIdx + 1; i < raw.length; i++) {
                        let r = raw[i];
                        if (!r[tglCol]) continue;
                        let dateInfo = parseDynamicDate(r[tglCol]);
                        if (!dateInfo) continue;
                        db.push({ iso: dateInfo.iso, displayDate: dateInfo.display, trxId: r[refCol] || "-", kategori: "-", desc: r[ketCol], deb: cleanAmt(r[debCol]), cre: cleanAmt(r[creCol]), status: "" });
                    }
                } else if (bank === 'BTN') {
                    let headers = raw[0].map(h => (h || "").toLowerCase().trim());
                    let tglCol = headers.indexOf("posting date"),
                        ketCol = headers.indexOf("description"),
                        debCol = headers.indexOf("debit"),
                        creCol = headers.indexOf("credit"),
                        refCol = headers.indexOf("reff no.");
                    for (let i = 1; i < raw.length; i++) {
                        let r = raw[i];
                        // Abaikan baris total atau baris kosong
                        if (!r[tglCol] || r[tglCol].toLowerCase().includes("total") || isNaN(parseInt(r[0]))) continue;
                        let dateInfo = parseDynamicDate(r[tglCol]);
                        if (!dateInfo) continue;
                        db.push({ iso: dateInfo.iso, displayDate: dateInfo.display, trxId: r[refCol] || "-", kategori: "-", desc: r[ketCol], deb: cleanAmt(r[debCol]), cre: cleanAmt(r[creCol]), status: "" });
                    }
                } else {
                    let headerIdx = raw.findIndex(r => r.some(c => ["tgl_tran", "date", "posting date", "tanggal", "post date"].includes((c || "").toLowerCase().trim())));
                    if (headerIdx === -1) headerIdx = 0;
                    let headers = raw[headerIdx].map(h => (h || "").trim().replace(/"/g, ''));
                    for (let i = headerIdx + 1; i < raw.length; i++) {
                        let r = raw[i]; if (!r || r.length < 3) continue;
                        let rowObj = {}; headers.forEach((h, idx) => { if(h) rowObj[h] = r[idx]; });
                        let dateKey = ['Post Date', 'PostDate', 'Posting Date', 'TGL_TRAN', 'Date', 'Tanggal'].find(k => rowObj[k]);
                        let dateInfo = parseDynamicDate(rowObj[dateKey]); if (!dateInfo) continue;
                        let deb = cleanAmt(rowObj['Debit'] || rowObj['Debit Amount'] || rowObj['MUTASI_DEBET'] || (rowObj['DB'] ? rowObj['Amount'] : 0));
                        let cre = cleanAmt(rowObj['Credit'] || rowObj['Credit Amount'] || rowObj['MUTASI_KREDIT'] || (rowObj['CR'] ? rowObj['Amount'] : 0));
                        db.push({ iso: dateInfo.iso, displayDate: dateInfo.display, trxId: rowObj['FT Number'] || rowObj['Reference No'] || rowObj['ID'] || "-", kategori: "-", desc: rowObj['Description'] || rowObj['Remarks'] || rowObj['DESK_TRAN'] || "", deb, cre, status: "" });
                    }
                }
                render();
            }
        });
    });

    function render() {
        const term = document.getElementById('searchTerm').value.toLowerCase();
        const start = document.getElementById('startDate').value, end = document.getElementById('endDate').value, typeF = document.getElementById('typeFilter').value;
        let sD = 0, sC = 0, html = '';
        db.filter(i => {
            const mS = (i.desc || "").toLowerCase().includes(term);
            const mD = (!start || i.iso >= start) && (!end || i.iso <= end);
            const mT = (typeF === "ALL") || (typeF === "DEBIT" && i.deb > 0) || (typeF === "CREDIT" && i.cre > 0);
            return mS && mD && mT;
        }).sort((a,b) => new Date(a.iso) - new Date(b.iso)).forEach(i => {
            sD += i.deb; sC += i.cre;
            html += `<tr><td>${i.displayDate}</td><td style="font-size:10px">${i.desc}</td><td class="num-col txt-red">${i.deb > 0 ? i.deb.toLocaleString('en-US',{minimumFractionDigits:2}) : '0.00'}</td><td class="num-col txt-green">${i.cre > 0 ? i.cre.toLocaleString('en-US',{minimumFractionDigits:2}) : '0.00'}</td><td class="trx-id">${i.trxId}</td><td><span class="kat-badge">${i.kategori}</span></td><td style="text-align:center">-</td></tr>`;
        });
        document.getElementById('tableData').innerHTML = html || '<tr><td colspan="7" style="text-align:center; padding:20px;">Data tidak ditemukan.</td></tr>';
        document.getElementById('dispDebit').innerText = sD.toLocaleString('en-US', {minimumFractionDigits:2});
        document.getElementById('dispCredit').innerText = sC.toLocaleString('en-US', {minimumFractionDigits:2});
    }

    function copyFullTable() {
        const rows = document.querySelectorAll("#mutasiTable tr");
        let content = "";
        rows.forEach(row => {
            let rowData = []; row.querySelectorAll("td, th").forEach(col => rowData.push(col.innerText));
            content += rowData.join("\t") + "\n";
        });
        saveToClipboard(content);
    }

    function copyIsiSaja() {
        const rows = document.querySelectorAll("#tableData tr");
        let content = "";
        rows.forEach(row => {
            let cells = row.querySelectorAll("td");
            if (cells.length >= 7) {
                let rowData = [cells[0].innerText, cells[1].innerText, cells[2].innerText, cells[3].innerText, cells[4].innerText];
                content += rowData.join("\t") + "\n";
            }
        });
        saveToClipboard(content);
    }

    function saveToClipboard(text) { navigator.clipboard.writeText(text).then(() => alert("Data berhasil disalin!")); }
    ['searchTerm', 'startDate', 'endDate', 'typeFilter'].forEach(id => document.getElementById(id).addEventListener('input', render));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutasi Filter Pro - Ahmad Zulfikar T</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background-color: #f4f7f9; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); flex: 1; }
        .config-panel { background: #eef2f7; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #d1d9e6; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
        select, input { padding: 10px; border: 1px solid #bec8d0; border-radius: 6px; font-size: 14px; }
        .btn-group { display: flex; gap: 10px; }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 13px; display: flex; align-items: center; gap: 5px; }
        .btn-copy { background: #3498db; color: white; }
        .btn-reset { background: #95a5a6; color: white; }
        .info-rekening { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; border-left: 5px solid #f1c40f; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { padding: 15px; border-radius: 8px; color: white; }
        .debit-card { background: #e74c3c; }
        .credit-card { background: #27ae60; }
        .val { font-size: 1.5rem; font-weight: bold; font-family: 'Consolas', monospace; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; }
        th { background: #2c3e50; color: white; padding: 12px; text-align: left; font-size: 14px; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }
        .num-col { text-align: right; font-family: 'Courier New', monospace; font-weight: bold; }
        .txt-red { color: #e74c3c; }
        .txt-green { color: #27ae60; }
        footer { text-align: center; padding: 20px; margin-top: 20px; color: #7f8c8d; font-size: 14px; border-top: 1px solid #eee; }
        .heart { color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 Convert Mutasi All Bank</h2>

    <div class="config-panel">
        <div class="row">
            <div class="input-group">
                <label><strong>1. Pilih Bank:</strong></label>
                <select id="bankSource">
                    <option value="">-- Pilih Bank --</option>
                    <option value="BCA">BCA (Corporate)</option>
                    <option value="BNI">BNI (Direct)</option>
                    <option value="MANDIRI">Mandiri (Statement)</option>
                    <option value="BRI">BRI (Corporate/CMS)</option>
                    <option value="BSI">BSI</option>
                    <option value="MAYBANK">Maybank</option>
                </select>
            </div>
            <div class="input-group">
                <label><strong>2. Upload CSV:</strong></label>
                <input type="file" id="csvFile" accept=".csv">
            </div>
            <div class="btn-group">
                <button class="btn btn-copy" onclick="copyTable()">📋 Salin Data</button>
                <button class="btn btn-reset" onclick="resetPage()">🔄 Reset</button>
            </div>
        </div>
        <div class="row">
            <div class="input-group"><label>Dari Tanggal:</label><input type="date" id="startDate"></div>
            <div class="input-group"><label>Sampai Tanggal:</label><input type="date" id="endDate"></div>
            <div class="input-group"><label>Cari Keterangan:</label><input type="text" id="searchTerm" placeholder="Cari teks..."></div>
        </div>
    </div>

    <div id="infoRekPanel" class="info-rekening">
        <h3 id="dispBankName" style="margin:0">BANK</h3>
        <p id="dispAccNo" style="margin:5px 0 0 0">No. Rekening: -</p>
    </div>

    <div class="summary-grid">
        <div class="card debit-card"><small>TOTAL DEBIT (KELUAR)</small><div id="dispDebit" class="val">0.00</div></div>
        <div class="card credit-card"><small>TOTAL CREDIT (MASUK)</small><div id="dispCredit" class="val">0.00</div></div>
    </div>

    <table id="mutasiTable">
        <thead><tr><th>Tanggal</th><th>Keterangan</th><th>Debit</th><th>Credit</th></tr></thead>
        <tbody id="tableData"><tr><td colspan="4" style="text-align:center; padding:40px; color:#999;">Pilih bank & upload file CSV.</td></tr></tbody>
    </table>
</div>

<footer> Made With <span class="heart">❤️</span> Ahmad Zulfikar T </footer>

<script>
    let db = [];
    const currentYear = new Date().getFullYear();
    const monthsMap = {'Jan':'01','Feb':'02','Mar':'03','Apr':'04','May':'05','Jun':'06','Jul':'07','Aug':'08','Sep':'09','Oct':'10','Nov':'11','Dec':'12'};

    function parseDynamicDate(dateStr) {
        if (!dateStr) return "";
        let cleanDate = dateStr.toString().trim().split(' ')[0]; 
        let parts = cleanDate.split(/[-/]/);
        if (parts[0].length === 4) return `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
        if (isNaN(parts[1])) {
            let m = monthsMap[parts[1]] || "01";
            let y = parts[2] || currentYear;
            return `${y}-${m}-${parts[0].padStart(2,'0')}`;
        }
        let d = parts[0].padStart(2,'0');
        let m = parts[1].padStart(2,'0');
        let y = parts[2] ? (parts[2].length === 2 ? "20" + parts[2] : parts[2]) : currentYear;
        return `${y}-${m}-${d}`;
    }

    function showInfo(bank, acc) {
        document.getElementById('dispBankName').innerText = "BANK " + bank;
        document.getElementById('dispAccNo').innerText = "No. Rekening: " + (acc || "-");
        document.getElementById('infoRekPanel').style.display = 'block';
    }

    function formatNumber(num) {
        return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function cleanAmt(val) {
        if (!val) return 0;
        // Hapus " DB", " CR", spasi, dan koma ribuan
        let s = val.toString().replace(/CR|DB/gi, '').replace(/,/g, '').replace(/"/g, '').trim();
        return parseFloat(s) || 0;
    }

    function resetPage() {
        document.getElementById('csvFile').value = "";
        document.getElementById('bankSource').value = "";
        document.getElementById('startDate').value = "";
        document.getElementById('endDate').value = "";
        document.getElementById('searchTerm').value = "";
        document.getElementById('infoRekPanel').style.display = 'none';
        document.getElementById('dispDebit').innerText = "0.00";
        document.getElementById('dispCredit').innerText = "0.00";
        document.getElementById('tableData').innerHTML = '<tr><td colspan="4" style="text-align:center; padding:40px; color:#999;">Pilih bank & upload file CSV.</td></tr>';
        db = [];
    }

    document.getElementById('csvFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const bank = document.getElementById('bankSource').value;
        if (!bank || !file) return;

        Papa.parse(file, {
            header: false, // Set false agar kita handle manual pencarian header
            skipEmptyLines: true,
            complete: (results) => {
                db = [];
                const data = results.data;
                
                if (bank === 'BCA') {
                    const accRow = data.find(r => r[0] && r[0].toLowerCase().includes("no. rekening"));
                    if (accRow) showInfo("BCA", accRow[0].split(":")[1].trim());

                    // Cari baris mulai (Cek Tanggal Transaksi)
                    let startIndex = -1;
                    for(let i=0; i<data.length; i++) {
                        if(data[i][0] && data[i][0].toLowerCase().includes("tanggal transaksi")) {
                            startIndex = i + 1;
                            break;
                        }
                    }

                    if(startIndex !== -1) {
                        for (let i = startIndex; i < data.length; i++) {
                            let r = data[i]; 
                            if (!r[0] || r[0].toLowerCase().includes("saldo") || r[0].toLowerCase().includes("mutasi")) continue;
                            
                            let iso = parseDynamicDate(r[0]);
                            let amtStr = (r[3] || "").toUpperCase(); 
                            let amt = cleanAmt(amtStr);
                            let isCr = amtStr.includes("CR");
                            if (iso) db.push({ iso, desc: r[1], deb: isCr ? 0 : amt, cre: isCr ? amt : 0 });
                        }
                    }
                } else {
                    // Logic Bank Lainnya menggunakan Header detection
                    const headers = data[0];
                    const matchAcc = file.name.match(/\d{10,}/);
                    if (matchAcc) showInfo(bank, matchAcc[0]);

                    for(let i=1; i < data.length; i++) {
                        let r = data[i];
                        let rowObj = {};
                        headers.forEach((h, idx) => rowObj[h.trim()] = r[idx]);

                        let iso = "", desc = "", deb = 0, cre = 0;
                        if (bank === 'BSI') {
                            iso = parseDynamicDate(rowObj['Date']);
                            desc = rowObj['Description'];
                            let amt = cleanAmt(rowObj['Amount']); 
                            if (rowObj['DB'] === 'DB') deb = amt; else cre = amt;
                        } else if (bank === 'MAYBANK') {
                            iso = parseDynamicDate(rowObj['Posting Date']);
                            desc = rowObj['Transaction Description']; 
                            deb = cleanAmt(rowObj['Debit']); 
                            cre = cleanAmt(rowObj['Credit']);
                        } else if (bank === 'BRI') {
                            iso = parseDynamicDate(rowObj['TGL_TRAN']);
                            desc = rowObj['DESK_TRAN'];
                            deb = cleanAmt(rowObj['MUTASI_DEBET']); 
                            cre = cleanAmt(rowObj['MUTASI_KREDIT']);
                        } else if (bank === 'MANDIRI') {
                            iso = parseDynamicDate(rowObj['PostDate']);
                            desc = (rowObj['Remarks'] || "") + " " + (rowObj['AdditionalDesc'] || "");
                            deb = cleanAmt(rowObj['Debit Amount']); 
                            cre = cleanAmt(rowObj['Credit Amount']);
                        } else if (bank === 'BNI') {
                            iso = parseDynamicDate(rowObj['Value Date'] ? rowObj['Value Date'].substring(0,8) : "");
                            desc = rowObj['Description'];
                            deb = cleanAmt(rowObj['Debit']);
                            cre = cleanAmt(rowObj['Credit']);
                        }
                        if (iso) db.push({ iso, desc, deb, cre });
                    }
                }
                render();
            }
        });
    });

    function render() {
        const term = document.getElementById('searchTerm').value.toLowerCase();
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        let sD = 0, sC = 0, html = '';

        const filtered = db.filter(i => {
            const mS = (i.desc || "").toLowerCase().includes(term);
            const mD = (!start || i.iso >= start) && (!end || i.iso <= end);
            return mS && mD;
        }).sort((a,b) => new Date(a.iso) - new Date(b.iso));

        filtered.forEach(i => {
            sD += i.deb; sC += i.cre;
            html += `<tr>
                <td>${i.iso.split('-').reverse().join('/')}</td>
                <td style="font-size:11px">${i.desc}</td>
                <td class="num-col txt-red">${i.deb > 0 ? formatNumber(i.deb) : '0.00'}</td>
                <td class="num-col txt-green">${i.cre > 0 ? formatNumber(i.cre) : '0.00'}</td>
            </tr>`;
        });

        document.getElementById('tableData').innerHTML = html || '<tr><td colspan="4" style="text-align:center; padding:20px; color:#999;">Data tidak ditemukan. Pastikan Bank dan File sesuai.</td></tr>';
        document.getElementById('dispDebit').innerText = formatNumber(sD);
        document.getElementById('dispCredit').innerText = formatNumber(sC);
    }

    function copyTable() {
        const rows = document.querySelectorAll("#mutasiTable tr");
        if (rows.length <= 1) return alert("Tidak ada data untuk disalin.");
        let content = "";
        rows.forEach(row => {
            const cols = row.querySelectorAll("td, th");
            let rowData = [];
            cols.forEach(col => rowData.push(col.innerText));
            content += rowData.join("\t") + "\n";
        });
        navigator.clipboard.writeText(content).then(() => alert("Data berhasil disalin!"));
    }

    ['searchTerm', 'startDate', 'endDate'].forEach(id => document.getElementById(id).addEventListener('input', render));
</script>
</body>
</html>
